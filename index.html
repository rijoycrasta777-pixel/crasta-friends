<script type="module">

  storageBucket: "crasta-friends.firebasestorage.app",

const fb = initializeApp(firebaseConfig);
const fs = getFirestore(fb);
const auth = getAuth(fb);
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const CURRENCIES = ["INR","USD","EUR","GBP","AED","SGD","THB","MYR","LKR","NPR","BTN","MVR","IDR","JPY","CNY","KRW","VND","HKD","AUD","NZD","CAD","CHF","SAR","QAR","KWD","OMR","BHD","ZAR","TRY","EGP"];

let unsubs = [], map = null, markers = null, S = null, user = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = p => "₹" + (p / 100).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const savedKey = () => "cf_trips_" + (user ? user.uid : "x");
const saved = () => JSON.parse(localStorage.getItem(savedKey()) || "[]");
const saveTrip = (id, name) => {
  const l = saved().filter(t => t.id !== id);
  l.unshift({id, name});
  localStorage.setItem(savedKey(), JSON.stringify(l.slice(0, 30)));
};
const locText = l => l ? [l.place, l.district, l.state, l.country].filter(Boolean).join(", ") : "";

function cleanup() {
  unsubs.forEach(f => f()); unsubs = [];
  if (map) { map.remove(); map = null; markers = null; }
}

// ---------- LOGIN ----------
onAuthStateChanged(auth, u => {
  user = u;
  renderBar();
  cleanup();
  if (!u) showLogin();
  else route();
});

function renderBar() {
  $("bar").innerHTML = user
    ? `<span>Signed in as ${esc(user.email)}</span><button id="out">Sign out</button>`
    : "";
  if (user) $("out").onclick = () => signOut(auth);
}

function showLogin() {
  app.innerHTML = `
    <h1>Crasta &amp; Friends ✈️</h1>
    <p class="sub">Sign in with your email to split trip and monthly expenses</p>
    <div class="card">
      <input id="le" type="email" autocomplete="email" placeholder="Email">
      <input id="lp" type="password" autocomplete="current-password" placeholder="Password (min 6 characters)">
      <button id="lin">Sign in</button>
      <button class="sec" id="lup">Create new account</button>
      <div style="text-align:center"><button class="link" id="lfp">Forgot password?</button></div>
    </div>`;
  const creds = () => [$("le").value.trim(), $("lp").value];
  const explain = e => {
    const m = {
      "auth/invalid-email": "That email address is not valid.",
      "auth/missing-password": "Please enter your password.",
      "auth/weak-password": "Password must be at least 6 characters.",
      "auth/email-already-in-use": "This email already has an account. Tap Sign in.",
      "auth/invalid-credential": "Wrong email or password.",
      "auth/user-not-found": "No account with this email. Tap Create new account.",
      "auth/wrong-password": "Wrong password.",
      "auth/too-many-requests": "Too many tries. Wait a few minutes."
    };
    alert(m[e.code] || ("Error: " + e.message));
  };
  $("lin").onclick = async () => {
    const [e, p] = creds();
    try { await signInWithEmailAndPassword(auth, e, p); } catch (x) { explain(x); }
  };
  $("lup").onclick = async () => {
    const [e, p] = creds();
    try { await createUserWithEmailAndPassword(auth, e, p); } catch (x) { explain(x); }
  };
  $("lfp").onclick = async () => {
    const e = $("le").value.trim();
    if (!e) return alert("Type your email first, then tap Forgot password.");
    try { await sendPasswordResetEmail(auth, e); alert("Password reset email sent to " + e); } catch (x) { explain(x); }
  };
}

// ---------- LIVE CURRENCY RATES ----------
async function getRates() {
  const c = JSON.parse(localStorage.getItem("cf_rates") || "null");
  if (c && Date.now() - c.t < 3600000) return c;
  try {
    const j = await (await fetch("https://open.er-api.com/v6/latest/INR")).json();
    if (j.rates) {
      const r = {t: Date.now(), rates: j.rates, updated: j.time_last_update_utc || ""};
      localStorage.setItem("cf_rates", JSON.stringify(r));
      return r;
    }
  } catch (e) {}
  try {
    const j = await (await fetch("https://api.frankfurter.app/latest?from=INR")).json();
    if (j.rates) {
      const r = {t: Date.now(), rates: {...j.rates, INR: 1}, updated: j.date || ""};
      localStorage.setItem("cf_rates", JSON.stringify(r));
      return r;
    }
  } catch (e) {}
  return c;
}

// ---------- GPS ----------
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("GPS not supported on this device"));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.message)), {enableHighAccuracy: true, timeout: 15000});
  });
}
async function locate() {
  const c = await getPos();
  const loc = {lat: +c.latitude.toFixed(5), lng: +c.longitude.toFixed(5), place: "", district: "", state: "", country: ""};
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12&addressdetails=1&accept-language=en&lat=${loc.lat}&lon=${loc.lng}`);
    const a = (await r.json()).address || {};
    loc.place = a.suburb || a.neighbourhood || a.village || a.town || a.city || a.hamlet || "";
    loc.district = a.state_district || a.county || a.city || a.town || "";
    loc.state = a.state || a.region || "";
    loc.country = a.country || "";
  } catch (e) {}
  return loc;
}

// ---------- PHOTO ----------
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => rej(new Error("Could not read photo"));
    img.src = url;
  });
}
async function photoData(file) {
  let d = await shrink(file, 900, 0.65);
  if (d.length > 800000) d = await shrink(file, 600, 0.5);
  return d;
}

// ---------- ROUTING ----------
function route() {
  cleanup();
  const id = location.hash.slice(1);
  id ? showTrip(id) : showHome();
}
window.addEventListener("hashchange", () => { if (user) route(); });

// ---------- HOME ----------
function showHome() {
  const list = saved().map(t => `<a class="item" href="#${esc(t.id)}"><span>${esc(t.name)}</span><small>${esc(t.id)}</small></a>`).join("");
  app.innerHTML = `
    <h1>Crasta &amp; Friends ✈️</h1>
    <p class="sub">Split trip and monthly expenses fairly</p>
    <div class="card">
      <h2>New group</h2>
      <input id="tn" placeholder="Name (e.g. Goa 2026 or Flat Expenses)">

        <option value="trip">One-time trip</option>
        <option value="monthly">Monthly share</option>
      </select>

    </div>

  $("create").onclick = async () => {

// ---------- TRIP ----------
async function showTrip(id) {
  app.innerHTML = "<p>Loading…</p>";
  let snap;
  try { snap = await getDoc(doc(fs, "trips", id)); }
  catch (e) { app.innerHTML = `<p>Could not connect: ${esc(e.message)}</p><a class="back" href="#">← Back</a>`; return; }
  if (!snap.exists()) { app.innerHTML = `<p>Not found.</p><a class="back" href="#">← Back</a>`; return; }

  const trip = snap.data();
  const members = trip.members;
  const monthly = trip.mode === "monthly";
  saveTrip(id, trip.name);
  S = {id, trip, exps: [], places: [], month: today().slice(0, 7), rates: null};
  const link = location.href;
  let expLoc = null, placeLoc = null;

  app.innerHTML = `
    <a class="back" href="#">← All groups</a>
    <h1>${esc(trip.name)}</h1>
    <p class="sub">${monthly ? "Monthly share" : "Trip"} · Code: <b>${esc(id)}</b><br>${members.map(esc).join(", ")}</p>
    <div class="card">
      <button class="sec" id="copy">Copy link</button>
      <button class="sec" id="addf">+ Add a friend</button>
      <a href="https://wa.me/?text=${encodeURIComponent("Join us on Crasta & Friends: " + link)}" target="_blank" style="display:block;text-align:center;color:#4ade80">Share on WhatsApp</a>
    </div>
    <div class="tabs">
      <button data-tab="exp" class="on">💰 Expenses</button>
      <button data-tab="pl">📸 Places</button>
      <button data-tab="sum">🗺️ Map</button>
    </div>

    <div id="pane-exp">
      ${monthly ? `<div class="card"><h2>Month</h2><input type="month" id="mp" value="${S.month}"></div>` : ""}
      <div class="card">
        <h2>Add expense</h2>
        <input id="ed" placeholder="What was it for? (e.g. Dinner)">
        <div class="row">
          <input id="ea" type="number" step="any" inputmode="decimal" placeholder="Amount">
          <select id="ec">${CURRENCIES.map(c => `<option>${c}</option>`).join("")}</select>
        </div>
        <div id="rateBox" style="display:none">
          <small>Rate: 1 <span id="rc"></span> = ₹ (you can edit)</small>
          <input id="er" type="number" step="any" inputmode="decimal">
          <small id="rinfo"></small>
        </div>
        <div id="conv" style="margin:4px 0 10px;color:#4ade80"></div>
        <input id="edt" type="date" value="${today()}">
        <small>Paid by:</small>
        <select id="ep">${members.map(m => `<option>${esc(m)}</option>`).join("")}</select>
        <small>Split between:</small>
        <div class="chk">${members.map(m => `<label><input type="checkbox" style="width:auto;margin:0 6px 0 0" value="${esc(m)}" checked>${esc(m)}</label>`).join("")}</div>
        <button class="sec" id="egps">📍 Tag my location (GPS)</button>
        <small id="eloc"></small>
        <button id="add" style="margin-top:10px">Add expense</button>
      </div>
      <div id="out"></div>
    </div>

    <div id="pane-pl" style="display:none">
      <div class="card">
        <h2>Add a place you visited</h2>
        <button class="sec" id="pgps">📍 Use my current location</button>
        <input id="pn" placeholder="Place name (e.g. Baga Beach)">
        <input id="pdi" placeholder="District">
        <input id="pst" placeholder="State">
        <input id="pco" placeholder="Country">
        <input id="pdt" type="date" value="${today()}">
        <textarea id="pnote" rows="2" placeholder="Notes (optional)"></textarea>
        <small>Photo (optional):</small>
        <input id="pph" type="file" accept="image/*">
        <button id="padd">Save place</button>
      </div>
      <div id="plist"></div>
    </div>

    <div id="pane-sum" style="display:none">
      <div id="map"></div>
      <div id="summary"></div>
    </div>`;

  $("copy").onclick = () => navigator.clipboard.writeText(link).then(() => alert("Link copied!"));
  $("addf").onclick = async () => {
    const n = (prompt("Friend's name:") || "").trim();
    if (!n || members.includes(n)) return;
    await updateDoc(doc(fs, "trips", id), {members: arrayUnion(n)});
    showTrip(id);
  };

  document.querySelector(".tabs").onclick = e => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    const t = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    ["exp", "pl", "sum"].forEach(k => $("pane-" + k).style.display = k === t ? "" : "none");
    if (t === "sum") {
      if (!map && window.L) {
        map = L.map("map").setView([20.5, 78.9], 4);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {attribution: "© OpenStreetMap", maxZoom: 19}).addTo(map);
        markers = L.layerGroup().addTo(map);
      }
      setTimeout(() => { if (map) { map.invalidateSize(); updateMap(); } }, 80);
    }
  };

  if (monthly) $("mp").onchange = e => { S.month = e.target.value || S.month; renderExp(); };

  const setRate = () => {
    const cur = $("ec").value;
    $("rateBox").style.display = cur === "INR" ? "none" : "";
    $("rc").textContent = cur;
    if (cur === "INR") { $("er").value = 1; }
    else if (S.rates && S.rates.rates[cur]) {
      $("er").value = Number((1 / S.rates.rates[cur]).toPrecision(6));

    preview();

    const a = parseFloat($("ea").value), r = parseFloat($("er").value);

  };

  $("egps").onclick = async () => {

  $("add").onclick = async () => {

    const cur = $("ec").value;
    const rate = cur === "INR" ? 1 : parseFloat($("er").value);

    const paidBy = $("ep").value;
    const split = [...document.querySelectorAll("#pane-exp .chk input:checked")].map(c => c.value);

    const data = {desc, cur, orig, rate, amount, paidBy, split, date: $("edt").value || today(), created: Date.now(), addedBy: user.email};
    if (expLoc) data.loc = expLoc;

  $("pgps").onclick = async () => {
    $("pgps").textContent = "Getting location…";
    try {
      placeLoc = await locate();
      if (!$("pn").value) $("pn").value = placeLoc.place;
      $("pdi").value = placeLoc.district; $("pst").value = placeLoc.state; $("pco").value = placeLoc.country;
      $("pgps").textContent = "📍 Location found ✓";
    } catch (e) { placeLoc = null; $("pgps").textContent = "📍 Use my current location"; alert("Could not get location: " + e.message); }
  };
  $("padd").onclick = async () => {
    const name = $("pn").value.trim();
    if (!name) return alert("Enter the place name.");
    const data = {
      name, date: $("pdt").value || today(), note: $("pnote").value.trim(),
      district: $("pdi").value.trim(), state: $("pst").value.trim(), country: $("pco").value.trim(), created: Date.now(), addedBy: user.email
    };
    if (placeLoc) { data.lat = placeLoc.lat; data.lng = placeLoc.lng; }
    $("padd").textContent = "Saving…";
    try {
      const f = $("pph").files[0];
      if (f) data.photo = await photoData(f);
      await addDoc(collection(fs, "trips", id, "places"), data);
      ["pn", "pdi", "pst", "pco", "pnote"].forEach(k => $(k).value = "");
      $("pph").value = ""; placeLoc = null; $("pgps").textContent = "📍 Use my current location";
    } catch (e) { alert("Could not save: " + e.message); }
    $("padd").textContent = "Save place";
  };
  $("plist").onclick = async e => {
    const b = e.target.closest("[data-delp]");
    if (b && confirm("Delete this place?")) await deleteDoc(doc(fs, "trips", id, "places", b.dataset.delp));
  };

  unsubs.push(onSnapshot(query(collection(fs, "trips", id, "expenses"), orderBy("created")), s => {
    S.exps = s.docs.map(d => ({id: d.id, ...d.data()}));
    renderExp(); renderSummary();
  }));
  unsubs.push(onSnapshot(query(collection(fs, "trips", id, "places"), orderBy("created")), s => {
    S.places = s.docs.map(d => ({id: d.id, ...d.data()}));
    renderPlaces(); renderSummary();
  }));
}

// ---------- CALCULATION ----------
function calc(members, exps) {
  const bal = Object.fromEntries(members.map(m => [m, 0]));
  exps.forEach(e => {
    const sp = e.split.filter(n => n in bal);
    if (!(e.paidBy in bal) || !sp.length) return;
    bal[e.paidBy] += e.amount;
    const base = Math.floor(e.amount / sp.length);
    const rem = e.amount - base * sp.length;
    sp.forEach((n, i) => { bal[n] -= base + (i < rem ? 1 : 0); });
  });
  const cr = [], de = [];
  Object.entries(bal).forEach(([n, v]) => { if (v > 0) cr.push([n, v]); else if (v < 0) de.push([n, -v]); });
  cr.sort((a, b) => b[1] - a[1]); de.sort((a, b) => b[1] - a[1]);
  const pay = [];
  let i = 0, j = 0;
  while (i < de.length && j < cr.length) {
    const amt = Math.min(de[i][1], cr[j][1]);
    pay.push({from: de[i][0], to: cr[j][0], amt});
    de[i][1] -= amt; cr[j][1] -= amt;
    if (de[i][1] === 0) i++;
    if (cr[j][1] === 0) j++;
  }
  return {bal, pay};
}

// ---------- RENDER ----------
function renderExp() {
  const out = $("out"); if (!out || !S) return;
  const members = S.trip.members, monthly = S.trip.mode === "monthly";
  const exps = (monthly ? S.exps.filter(e => (e.date || "").startsWith(S.month)) : S.exps)
    .slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.created - a.created);
  const {bal, pay} = calc(members, exps);
  const total = exps.reduce((s, e) => s + e.amount, 0);
  const label = monthly ? new Date(S.month + "-01").toLocaleString("en-IN", {month: "long", year: "numeric"}) : "";
  out.innerHTML = `
    <div class="card">
      <h2>Who pays whom ${label ? "· " + esc(label) : ""}</h2>
      ${pay.length ? pay.map(p => `<div class="item"><span><b>${esc(p.from)}</b> pays <b>${esc(p.to)}</b></span><b>${money(p.amt)}</b></div>`).join("") : "<small>All settled. 🎉</small>"}
    </div>
    <div class="card">
      <h2>Balances</h2>
      ${members.map(m => `<div class="item"><span>${esc(m)}</span><b class="${bal[m] >= 0 ? "pos" : "neg"}">${bal[m] >= 0 ? "gets " : "owes "}${money(Math.abs(bal[m]))}</b></div>`).join("")}
    </div>
    <div class="card">
      <h2>Expenses · Total ${money(total)}</h2>
      ${exps.length ? exps.map(e => `
        <div class="item">
          <span>${esc(e.desc)}<br><small>${esc(e.paidBy)} paid · split ${e.split.length} · ${esc(e.date || "")}</small>
          ${e.cur && e.cur !== "INR" ? `<br><small>${esc(e.cur)} ${Number(e.orig).toLocaleString("en-IN")} @ ₹${Number(e.rate.toPrecision(5))}</small>` : ""}
          ${e.loc ? `<br><small>📍 ${esc(locText(e.loc))}</small>` : ""}
          ${e.addedBy ? `<br><small>Added by ${esc(e.addedBy)}</small>` : ""}</span>
          <span style="text-align:right"><b>${money(e.amount)}</b><br><button class="del" data-del="${e.id}">✕</button></span>
        </div>`).join("") : "<small>No expenses yet.</small>"}
    </div>`;
}

function renderPlaces() {
  const el = $("plist"); if (!el || !S) return;
  const list = S.places.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  el.innerHTML = list.length ? list.map(p => `
    <div class="card pl">
      <div class="item" style="border:0;padding:0">
        <span><b>${esc(p.name)}</b><br><small>${esc([p.district, p.state, p.country].filter(Boolean).join(", "))} · ${esc(p.date || "")}</small></span>
        <button class="del" data-delp="${p.id}">✕</button>
      </div>
      ${p.photo ? `<img src="${p.photo}" alt="${esc(p.name)}">` : ""}
      ${p.note ? `<div>${esc(p.note)}</div>` : ""}
      ${p.lat != null ? `<a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" style="color:#4ade80">Open in Maps</a>` : ""}
    </div>`).join("") : `<div class="card"><small>No places yet. Add your first one above.</small></div>`;
}

function renderSummary() {
  const el = $("summary"); if (!el || !S) return;
  const items = [...S.places, ...S.exps.filter(e => e.loc).map(e => e.loc)];
  const tree = {};
  items.forEach(i => {
    if (!i.country && !i.state && !i.district) return;
    const c = i.country || "Unknown country", s = i.state || "Unknown state";
    tree[c] = tree[c] || {};
    tree[c][s] = tree[c][s] || new Set();
    if (i.district) tree[c][s].add(i.district);
  });
  const countries = Object.keys(tree);
  const states = countries.reduce((n, c) => n + Object.keys(tree[c]).length, 0);
  const districts = countries.reduce((n, c) => n + Object.values(tree[c]).reduce((m, s) => m + s.size, 0), 0);
  el.innerHTML = `
    <div class="card">
      <h2>Places covered</h2>
      <div class="stat">
        <div><b>${countries.length}</b><small>Countries</small></div>
        <div><b>${states}</b><small>States</small></div>
        <div><b>${districts}</b><small>Districts</small></div>
      </div>
      <div class="tree">
        ${countries.length ? countries.map(c => `<div><b>🌍 ${esc(c)}</b>
          ${Object.entries(tree[c]).map(([s, d]) => `<div style="margin-left:14px">📍 ${esc(s)}${d.size ? `<br><small style="margin-left:18px">${[...d].map(esc).join(", ")}</small>` : ""}</div>`).join("")}</div>`).join("")
          : "<small>Add places or tag expenses with GPS to see them here.</small>"}
      </div>
    </div>`;
  updateMap();
}

function updateMap() {
  if (!map || !markers || !S) return;
  markers.clearLayers();
  const pts = [];
  S.places.forEach(p => { if (p.lat != null) pts.push([p.lat, p.lng, p.name]); });
  S.exps.forEach(e => { if (e.loc && e.loc.lat != null) pts.push([e.loc.lat, e.loc.lng, e.desc]); });
  pts.forEach(p => L.marker([p[0], p[1]]).bindPopup(esc(p[2])).addTo(markers));
  if (pts.length) map.fitBounds(pts.map(p => [p[0], p[1]]), {padding: [30, 30], maxZoom: 12});
}
</script>
